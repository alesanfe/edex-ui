name: Build packaged binaries

on: [push, pull_request, create]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install build deps
      run: npm install
    - name: Run prebuild script
      run: npm run prebuild-linux
    - name: Build for x64
      run: ./node_modules/.bin/electron-builder build -l --x64 -p never
      env:
        DEBUG: electron-builder
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: npm install && node prebuild-copy.js && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm64
      run: |
        docker run --rm --platform linux/arm64 \
          -e DEBUG=electron-builder \
          -v "$PWD":/work -w /work \
          node:20-bullseye \
          bash -lc "apt-get update -qq && apt-get install -y -qq build-essential python3 >/dev/null && npm install --ignore-scripts && ./node_modules/.bin/electron-builder build -l --arm64 -p never"
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm64-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        path: ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-windows
      env:
        DEBUG: electron-builder
        # Code signing activates automatically when these secrets are configured
        CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        path: ~/Library/Caches/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-darwin
      env:
        DEBUG: electron-builder
        # macOS signing + notarization activate when these secrets are configured
        CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - uses: actions/upload-artifact@v4
      with:
        name: MacOS-Image
        path: dist/*.dmg
        if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-linux-arm64, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    # --- Automated release checklist (REL-004) ---------------------------------
    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKGVER=$(node -p "require('./package.json').version")
        SRCVER=$(node -p "require('./src/package.json').version")
        echo "tag=$TAG package=$PKGVER src=$SRCVER"
        # Allow prerelease tags like v3.0.0-rc.1 to match base version 3.0.0
        BASE="${TAG%%-*}"
        [ "$BASE" = "$PKGVER" ] || { echo "::error::tag $TAG != package.json $PKGVER"; exit 1; }
        [ "$BASE" = "$SRCVER" ] || { echo "::error::tag $TAG != src/package.json $SRCVER"; exit 1; }
    - name: Verify release tag ships from an authorized branch
      run: |
        git fetch --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true
        # Hard rule: refuse to release a commit that is not on any pushed branch.
        if ! git branch -r --contains "$GITHUB_SHA" | grep -q .; then
          echo "::error::tag commit is not on any remote branch - refusing to publish"
          exit 1
        fi
        # Informational: warn when the release line is not the default branch.
        DEF=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEF" 2>/dev/null; then
          echo "::warning::tag commit is not an ancestor of default branch '$DEF'"
        fi
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Verify expected artifacts are present
      run: |
        cd artifacts
        ls -la
        MISSING=0
        for pat in "xDEX-UI-Windows" "xDEX-UI-Linux" "xDEX-UI-macOS"; do
          ls $pat* >/dev/null 2>&1 || { echo "::error::expected artifact matching '$pat*' missing"; MISSING=1; }
        done
        [ "$MISSING" = "0" ]
    - name: Generate SHA-256 checksums
      run: |
        cd artifacts
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt
    - name: Generate SBOM
      run: |
        npm sbom --sbom-format cyclonedx --omit=dev > artifacts/sbom.cyclonedx.json
        node -e "const s=require('./artifacts/sbom.cyclonedx.json'); if(!s.components||!s.components.length) throw new Error('empty SBOM')"
    - name: Create GitHub release
      run: |
        PRE=""
        case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
        gh release create "$GITHUB_REF_NAME" artifacts/* --title "xDEX-UI $GITHUB_REF_NAME" --generate-notes $PRE
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
